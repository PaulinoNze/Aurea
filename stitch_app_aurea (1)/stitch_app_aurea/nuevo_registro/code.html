<script>
        // Simple numpad interaction visual logic
        const display = document.getElementById('amount-display');
        let currentValue = '0';
        let hasDecimal = false;

        document.querySelectorAll('.numpad-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const val = e.currentTarget.textContent.trim();
                
                if(e.currentTarget.querySelector('.material-symbols-outlined')) {
                    // Backspace logic
                    if (currentValue.length > 1) {
                        if (currentValue.slice(-1) === '.') hasDecimal = false;
                        currentValue = currentValue.slice(0, -1);
                    } else {
                        currentValue = '0';
                    }
                } else if (val === '.') {
                    if (!hasDecimal) {
                        currentValue += '.';
                        hasDecimal = true;
                    }
                } else {
                    if (currentValue === '0' && val !== '.') {
                        currentValue = val;
                    } else {
                        // Limit length for UI
                        if (currentValue.length < 9) {
                            currentValue += val;
                        }
                    }
                }
                
                display.textContent = currentValue;
                
                // Add tiny bounce effect to display
                display.style.transform = 'scale(1.05)';
                setTimeout(() => {
                    display.style.transform = 'scale(1)';
                    display.style.transition = 'transform 0.1s ease-out';
                }, 50);
            });
        });
    </script>
